# =============================================================================
# Agent Discovery & Triage — the "automations" half of the loop.
#
# On a schedule (and on demand), a scout agent reads the repo memory
# (LOOP_STATE.md), inspects repo health, dedupes against open `agent-loop`
# issues, and files a small number of well-formed issues. Each issue contains
# a "Task for the loop" section you can paste straight into the Agent Loop
# workflow's `task` input — discovery feeds the loop, a human stays in between.
#
# Auth (one repo secret): CLAUDE_CODE_OAUTH_TOKEN (Claude Pro/Max
# subscription — `claude setup-token`), ANTHROPIC_API_KEY, CODEX_AUTH_JSON
# (ChatGPT subscription — `codex login`, paste ~/.codex/auth.json), or
# OPENAI_API_KEY. The engine (claude / codex CLI) is picked to match.
# =============================================================================
name: Agent Discovery & Triage

on:
  schedule:
    - cron: "0 6 * * 1" # 06:00 UTC every Monday — adjust to taste
  workflow_dispatch:
    inputs:
      focus:
        description: "Optional focus area for this discovery run"
        required: false
        default: ""
        type: string
      model:
        description: "Model for the scout (empty = default)"
        required: false
        default: ""
        type: string
      engine:
        description: "Agent CLI: auto (by available secrets), claude, or codex (OpenAI)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - claude
          - codex

permissions:
  contents: read
  issues: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      FOCUS: ${{ inputs.focus }}
      SCOUT_MODEL: ${{ inputs.model }}
      ENGINE: ${{ inputs.engine }}
    steps:
      - name: Resolve engine & check auth
        run: |
          ENGINE="${ENGINE:-auto}"
          if [ "$ENGINE" = "auto" ]; then
            if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || [ -n "$ANTHROPIC_API_KEY" ]; then
              ENGINE=claude
            elif [ -n "$CODEX_AUTH_JSON" ] || [ -n "$OPENAI_API_KEY" ]; then
              ENGINE=codex
            else
              echo "::error::No auth configured. Add a repo secret: CLAUDE_CODE_OAUTH_TOKEN (Claude subscription — 'claude setup-token'), ANTHROPIC_API_KEY, CODEX_AUTH_JSON (ChatGPT subscription — 'codex login', paste ~/.codex/auth.json), or OPENAI_API_KEY."
              exit 1
            fi
          fi
          if [ "$ENGINE" = "claude" ] && [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "ANTHROPIC_API_KEY=" >> "$GITHUB_ENV"
          fi
          echo "Engine: $ENGINE"
          echo "ENGINE=$ENGINE" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install agent CLI
        run: |
          if [ "$ENGINE" = "codex" ]; then
            npm install -g @openai/codex
            if [ -n "$CODEX_AUTH_JSON" ]; then
              mkdir -p "$HOME/.codex"
              printf '%s' "$CODEX_AUTH_JSON" > "$HOME/.codex/auth.json"
              chmod 600 "$HOME/.codex/auth.json"
            elif [ -n "$OPENAI_API_KEY" ]; then
              codex login --api-key "$OPENAI_API_KEY"
            fi
          else
            curl -fsSL https://claude.ai/install.sh | bash
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Ensure label exists
        run: gh label create agent-loop --color 5319e7 --description "Created by the agent loop pipeline" 2>/dev/null || true

      - name: Run discovery scout
        run: |
          PROMPT=$(cat <<'EOF'
          You are loop-scout, the discovery-and-triage automation of this repo's engineering loop.

          1. Read LOOP_STATE.md (repo memory) and CLAUDE.md first.
          2. Investigate repo health: recent history (git log --oneline -20), TODO/FIXME/HACK markers,
             whether the deterministic gate is green on this branch (bash .github/scripts/detect-and-test.sh),
             suspicious or untested recently-changed files, and anything the "Next" section of
             LOOP_STATE.md says is pending.
          3. Dedupe before filing anything: gh issue list --label agent-loop --state open
          4. File AT MOST 5 new issues with:
             gh issue create --label agent-loop --title "..." --body "..."
             Each body must contain three sections: "Problem", "Evidence" (file:line references),
             and "Task for the loop" — one paragraph phrased so it can be pasted directly into the
             Agent Loop workflow's `task` input.
          5. Finish with a markdown report: a table of findings (new / already tracked / ignored and why)
             and the single highest-priority task you would run next.
          EOF
          )
          if [ -n "$FOCUS" ]; then
            PROMPT="$PROMPT

          Extra focus requested for this run: $FOCUS"
          fi
          MODEL_ARGS=()
          [ -n "$SCOUT_MODEL" ] && MODEL_ARGS=(--model "$SCOUT_MODEL")
          if [ "$ENGINE" = "codex" ]; then
            codex exec \
              --sandbox danger-full-access \
              --skip-git-repo-check \
              --output-last-message "$RUNNER_TEMP/scout-report.md" \
              "${MODEL_ARGS[@]}" \
              "$PROMPT" > "$RUNNER_TEMP/scout.log" 2>&1 || true
            {
              echo "## Discovery & triage report"
              echo ""
              cat "$RUNNER_TEMP/scout-report.md" 2>/dev/null || echo "scout produced no report"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            claude -p "$PROMPT" \
              --agent loop-scout \
              --output-format json \
              --permission-mode acceptEdits \
              --allowedTools "Bash,Read,Glob,Grep" \
              --max-turns 30 \
              "${MODEL_ARGS[@]}" \
              > "$RUNNER_TEMP/scout.json" || true
            {
              echo "## Discovery & triage report"
              echo ""
              jq -r '.result // "scout produced no report"' "$RUNNER_TEMP/scout.json" 2>/dev/null || echo "scout produced no output"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
